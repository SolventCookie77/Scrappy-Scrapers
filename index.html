
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animation</title>

    <style>
        /* Remove all page margins */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Black background, fill the phone screen */
        body {
            background-color: black;
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Video sizing */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <!-- Automatically plays and loops forever -->
    <video autoplay loop muted playsinline>
        <source src="Spontaneous_Scraper_Scrapin.mp4" type="video/mp4">
        Your browser does not support video playback.
    </video>

</body>
</html>
